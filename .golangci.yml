run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - typecheck
    - gofmt
    - goimports
    - revive
    - gosec
    - misspell
    - unconvert
    - unparam
    - whitespace
    - exportloopref
    - gocyclo
    - gocognit
    - goconst
    - godot
    - dupl
    - prealloc

linters-settings:
  gocyclo:
    min-complexity: 15
  gocognit:
    min-complexity: 20
  revive:
    rules:
      - name: exported
        severity: warning
        disabled: false
      - name: unexported-return
        severity: warning
        disabled: false
  gosec:
    excludes:
      - G104 # Audit errors not checked (we handle this explicitly)
  govet:
    check-shadowing: true
  errcheck:
    check-type-assertions: true
    check-blank: true

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - dupl
        - gosec
    - path: examples/
      linters:
        - errcheck
        - gosec
    - linters:
        - staticcheck
      text: "SA1019:" # Ignore deprecation warnings for now

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
